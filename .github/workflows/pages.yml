name: Publier la démo (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # chaque lundi : base des médicaments à jour
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Base publique des médicaments
        run: python3 scripts/build_medicaments.py
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  cloudflare:
    # Publie aussi le site sur https://werguisn.pages.dev (Cloudflare Pages).
    # Nécessite le secret CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions).
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.CF_TOKEN != ''
      - name: Base publique des médicaments
        if: env.CF_TOKEN != ''
        run: python3 scripts/build_medicaments.py
        continue-on-error: true
      - name: Publier sur Cloudflare Pages
        if: env.CF_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 856fad5ade4a8e56c5e504e64d412f5e
        run: |
          mkdir -p _site_cf
          cp -r index.html app demo _site_cf/
          if [ -f medicaments.json ]; then cp medicaments.json _site_cf/; fi
          npx --yes wrangler@4.152.0 pages deploy _site_cf --project-name werguisn --branch main --commit-dirty=true
      - name: Secret manquant
        if: env.CF_TOKEN == ''
        run: echo "Ajoutez le secret CLOUDFLARE_API_TOKEN pour publier sur werguisn.pages.dev."
